中独立成项。</text><rect x="48" y="978" width="5" height="63" rx="0" fill="#BB547B"/><text x="68" y="990.2" fill="#173451" font-size="18.000" font-weight="700" text-anchor="start">口径：HC区间≠完整Python层；衔接和U可含实际任务与间隔，不直接称“空闲”。15段为当前已核对路径；缺锚点保留未识别整窗。</text><text x="68" y="1018.3" fill="#5C7187" font-size="17.000" font-weight="400" text-anchor="start">汇总：逐rank逐轮估算 → 各rank周期均值 → 取最大rank；全部分项用同一rank。方法1每次D/C目标调用加14μs；方法2不叠加。</text><text x="68" y="1044.5" fill="#5C7187" font-size="15.000" font-weight="400" text-anchor="start">依据：profile_ep128.py（20261103.12.native_stages）· a_hc_cycles / _lm_source_round / _lm_estimate_method / residual_stage_plan；宽度不表示耗时比例。</text></svg>