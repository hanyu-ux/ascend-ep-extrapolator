<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F3F6FA"/><rect x="48" y="31" width="6" height="96" rx="0" fill="#167D8D"/><text x="72" y="46.1" fill="#167D8D" font-size="19.000" font-weight="700" text-anchor="start">统计口径  /  一页详解</text><text x="72" y="96.80000000000001" fill="#173451" font-size="42.000" font-weight="700" text-anchor="start">整轮HC周期如何拆解：层区间、层间衔接与15阶段</text><text x="72" y="135.0" fill="#5C7187" font-size="20.000" font-weight="400" text-anchor="start">源8主层＋3草稿层 → 目标61主层＋3草稿层  ｜  设备锚点连续跨度 · 实测分区与外推假设分开</text><rect x="1610" y="24" width="262" height="34" rx="9" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/><text x="1741.0" y="44.4" fill="#5C7187" font-size="16.000" font-weight="400" text-anchor="middle">示意图：宽度不代表实测耗时</text><rect x="48" y="166" width="1824" height="185" rx="12" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/><text x="68" y="198.7" fill="#173451" font-size="23.000" font-weight="700" text-anchor="start">01  整轮时间轴：从主0首HCPre.start，到下一轮主0首HCPre.start</text><text x="68" y="228.2" fill="#167D8D" font-size="18.000" font-weight="700" text-anchor="start">主模型层链：8个层区间 ＋ 7段层间衔接</text><text x="1016" y="228.2" fill="#7166A6" font-size="18.000" font-weight="700" text-anchor="start">草稿层链：3个层区间 ＋ 2段衔接</text><rect x="68" y="242" width="66" height="51" rx="5" fill="#167D8D"/><text x="101.0" y="272.9" fill="#FFFFFF" font-size="21.000" font-weight="700" text-anchor="middle">主0</text><rect x="134" y="242" width="16" height="51" rx="0" fill="#E7AE39"/><rect x="150" y="242" width="66" height="51" rx="5" fill="#167D8D"/><text x="183.0" y="272.9" fill="#FFFFFF" font-size="21.000" font-weight="700" text-anchor="middle">主1</text><rect x="216" y="242" width="16" height="51" rx="0" fill="#E7AE39"/><rect x="232" y="242" width="66" height="51" rx="5" fill="#167D8D"/><text x="265.0" y="272.9" fill="#FFFFFF