">草1</text><rect x="1284" y="242" width="16" height="51" rx="0" fill="#E4C68A"/><rect x="1300" y="242" width="126" height="51" rx="5" fill="#7166A6"/><text x="1363.0" y="272.9" fill="#FFFFFF" font-size="21.000" font-weight="700" text-anchor="middle">草2</text><rect x="1450" y="242" width="354" height="51" rx="5" fill="#F9EDF2"/><text x="1627.0" y="265.8" fill="#BB547B" font-size="22.000" font-weight="700" text-anchor="middle">U2：草稿 → 下一轮主</text><text x="1627.0" y="287.5" fill="#BB547B" font-size="15.000" font-weight="400" text-anchor="middle">7个父阶段</text><polygon points="713,260 726,267.0 713,274 717.16,267.0" fill="#8A9AAF"/><polygon points="997,260 1010,267.0 997,274 1001.16,267.0" fill="#8A9AAF"/><polygon points="1431,260 1444,267.0 1431,274 1435.16,267.0" fill="#8A9AAF"/><line x1="1824" y1="234" x2="1824" y2="301" stroke="#173451" stroke-width="2"/><text x="1851" y="224.5" fill="#5C7187" font-size="15.000" font-weight="400" text-anchor="end">下一轮起点</text><text x="68" y="316.3" fill="#5C7187" font-size="17.000" font-weight="400" text-anchor="start">① 主层区间  +  ② 主衔接（黄色小段）</text><text x="1016" y="316.3" fill="#5C7187" font-size="17.000" font-weight="400" text-anchor="start">③ 草稿层区间  +  ④ 草稿衔接</text><text x="862.0" y="315.4" fill="#BB547B" font-size="16.000" font-weight="400" text-anchor="middle">主末HCPost → 草首HCPre</text><text x="1627.0" y="315.4" fill="#BB547B" font-size="16.000" font-weight="400" text-anchor="middle">草末HCPost → 下轮主首HCPre</text><text x="68" y="344.0" fill="#173451" font-size="20.000" font-weight="700" text-anchor="start">R源 / R目标均按五项闭合：①主层区间 ＋ ②主衔接 ＋ ③草稿层区间 ＋ ④草稿衔接 ＋ ⑤U（U1＋U2）</text><rect x="48" y="369" width="1004" height="235" rx="12" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/><text x="68" y="401.7" fill="#173451" font-size="23.000" font-weight="700" text-anchor="start">02  放大一层：首个clone在HC统计起点之前，另计</text><text x="68" y="431.4" fill="#5C7187" font-size="16.000" font-weight="400" text-anchor="start">源码层内的前置工作</text><text x="638.0" y="432.3" fill="#167D8D" font-size="17.000" font-weight="700" text-anchor="middle">本层 W：首HCPre.start → 末HCPost.end</text><rect x="68" y="446" width="160" height="72" rx="5" fill="#FFF2D8"/><text x="148.0" y="474.9" fill="#173451" font-size="21.000" font-weight="700" text-anchor="middle">首个clone</text><text x="148.0" y="500.72999999999996" fill="#173451" font-size="21.000" font-weight="700" text-anchor="middle">残差保存</text><rect x="244" y="446" width="120" height="72" rx="5" fill="#167D8D"/><text x="304.0" y="472.3" fill="#FFFFFF" font-size="17.000" font-weight="700" text-anchor="middle">首HCPre</text><text x="304.0" y="493.21000000000004" fill="#FFFFFF" font-size="17.000" font-weight="700" text-anchor="middle">Attention入口</text><rect x="380" y="446" width="220" height="72" rx="5" fill="#E9F4F5"/><text x="490.0" y="476.0" fill="#173451" font-size="20.000" font-weight="400" text-anchor="middle">Norm → Attention</text><text x="490.0" y="500.6" fill="#173451" font-size="20.000" font-weight="400" text-anchor="middle">→ HCPost</text><rect x="616" y="446" width="258" height="72" rx="5" fill="#E9F4F5"/><text x="745.0" y="473.1051142546246" fill="#173451" font-size="16.783" font-weight="400" text-anchor="middle">clone → HCPre → Norm</text><text x="745.0" y="493.7487704026115" fill="#173451" font-size="16.783" font-weight="400" text-anchor="middle">→ MoE（Dispatch / Combine）</text><rect x="890" y="446" width="142" height="72" rx="5" fill="#167D8D"/><text x="961.0" y="473.2" fill="#FFFFFF" font-size="18.000" font-weight="700" text-anchor="middle">末HCPost</text><text x="961.0" y="495.34" fill="#FFFFFF" font-size="18.000" font-weight="700" text-anchor="middle">FFN出口</text><polygon points="230,474 242,481.0 230,488 233.84,481.0" fill="#8A9AAF"/><polygon points="366,474 378,481.0 366,488 369.84,481.0" fill="#8A9AAF"/><polygon points="602,474 614,481.0 602,488 605.84,481.0" fill="#8A9AAF"/><polygon points="876,474 888,481.0 876,488 879.84,481.0" fill="#8A9AAF"/><rect x="68" y="528" width="160" height="5" rx="0" fill="#E7AE39"/><rect x="244" y="528" width="788" height="5" rx="0" fill="#167D8D"/><text x="68" y="554.4" fill="#5C7187" font-size="16.000" font-weight="400" text-anchor="start">计入此前衔接 / U末段</text><text x="638.0" y="555.3" fill="#167D8D" font-size="17.000" font-weight="400" text-anchor="middle">W内已包含Attention、FFN主体，以及中间的clone；不等于完整Python层耗时</text><text x="68" y="589.3" fill="#5C7187" font-size="17.000" font-weight="400" text-anchor="start">Gi = 下一层首HCPre.start − 本层末HCPost.end；该段可含clone、辅助特征处理及任务间隔。</text><rect x="1072" y="369" width="800" height="235" rx="12" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/><text x="1092" y="401.7" fill="#173451" font-size="23.000" font-weight="700" text-anchor="start">03  8主 → 61主：层均值重建，衔接另算</text><text x="1092" y="437.9" fill="#167D8D" font-size="21.000" font-weight="700" text-anchor="start">主层：31×HCA目标均值 ＋ 30×CSA目标均值</text><text x="1092" y="464.4" fill="#5C7187" font-size="16.000" font-weight="400" text-anchor="start">HCA参考主1/3/5/7；CSA参考主2/4/6；主0仅排除参考，目标仍为61层</text><text x="1092" y="496.9" fill="#9C6815" font-size="21.000" font-weight="700" text-anchor="start">主衔接：源7段之和 ＋ 53×源6段参考均值</text><text x="1092" y="524.3" fill="#5C7187" font-size="17.000" font-weight="400" text-anchor="start">0→1保留在源7段中；新增53段的6段参考均值不含0→1</text><text x="1092" y="556.0" fill="#7166A6" font-size="20.000" font-weight="700" text-anchor="start">草稿：3×SWA目标均值 ＋ 源2段衔接；U保留一次</text><text x="1092" y="588.4" fill="#5C7187" font-size="16.000" font-weight="400" text-anchor="start">目标均值＝源类别均值＋Δ通信＋Δ路由GMM；新增衔接及U沿用属于估算假设</text><rect x="48" y="624" width="1824" height="335" rx="12" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/><text x="68" y="656.7" fill="#BB547B" font-size="23.000" font-weight="700" text-anchor="start">04  只展开第⑤项 U：8 ＋ 7 ＝ 15个父阶段，不能重复加到整轮</text><text x="1852" y="656.4" fill="#5C7187" font-size="16.000" font-weight="400" text-anchor="end">连续跨度含段内间隔；子阶段已包含于父阶段</text><text x="68" y="694.0" fill="#BB547B" font-size="20.000" font-weight="70