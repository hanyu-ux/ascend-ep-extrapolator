name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standard-library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline regression tests
        run: python -B -S -m unittest discover -s tests -p 'test_ep128*.py' -v

  windows-spawn:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify serial and spawn results on Windows
        run: python -B -S -m unittest discover -s tests -p 'test_ep128*parallel.py' -v
      - name: Verify Windows CLI and report export
        if: ${{ !cancelled() }}
        run: python -B -S -m unittest discover -s tests -p 'test_ep128_v2_cli.py' -v
      - name: Verify BS and speculation sweep charts on Windows
        if: ${{ !cancelled() }}
        run: python -B -S -m unittest discover -s tests -p 'test_ep128*sweep*.py' -v
      - name: Verify shared source rank and offline alignment on Windows
        if: ${{ !cancelled() }}
        run: python -B -S -m unittest discover -s tests -p 'test_ep128*source_rank*.py' -v
      - name: Verify bound evidence and offline export on Windows
        if: ${{ !cancelled() }}
        run: |
          python -B -S -m unittest discover -s tests -p 'test_ep128*bound*.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_roofline.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_pmu_memory_fields.py' -v
      - name: Verify combined trends, source-linked steps and navigation on Windows
        if: ${{ !cancelled() }}
        run: |
          python -B -S -m unittest discover -s tests -p 'test_ep128_consolidated_trends.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_focus_source.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_internal_links.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_report_navigation.py' -v
      - name: Verify method3 and linear HTML export on Windows
        if: ${{ !cancelled() }}
        run: |
          python -B -S -m unittest discover -s tests -p 'test_ep128_method3*.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_html_performance.py' -v
      - name: Verify output-fraction acceptance and historical report semantics on Windows
        if: ${{ !cancelled() }}
        run: |
          python -B -S -m unittest discover -s tests -p 'test_ep128_acceptance*.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_v2_driver.py' -v
      - name: Verify layer stages and per-case BS/S labels on Windows
        if: ${{ !cancelled() }}
        run: |
          python -B -S -m unittest discover -s tests -p 'test_ep128_target_stages.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_attention_prepare.py' -v
          python -B -S -m unittest discover -s tests -p 'test_ep128_case_table_labels.py' -v
